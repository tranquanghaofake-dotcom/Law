# ====== CẤU HÌNH PIPELINE ======
# Trụ nội dung = bộ lọc (xem Brief). LLM dùng mô tả này để phân loại.
pillars:
  T1:
    name: "Tiền & hợp đồng đời thường"
    desc: "đặt cọc, vay mượn bạn bè, chuyển khoản nhầm, mua hàng online, thuê trọ, lừa đảo nhỏ"
  T2:
    name: "Đi làm"
    desc: "thử việc, nghỉ việc, giữ lương, giữ bằng, hợp đồng cộng tác viên, tăng ca, BHXH, sa thải"
  T3:
    name: "Có bị đi tù không?"
    desc: "ranh giới dân sự/hành chính/hình sự trong tình huống đời thường của người trẻ"

audience: "người Việt 18–30 đang đi học/đi làm, thuê trọ, vay mượn, mua bán online"

# Ngưỡng chọn: tổng 3 cột (viral + đúng khán giả + trả lời chắc) >= 2 và trả lời chắc = 1
selection:
  min_total: 2
  require_confident: true

# ---- Nguồn thu thập ----
# Curation tay vẫn là nguồn chính; từ 31/10/2026 bật thêm API chính thức (Threads, Reddit, YouTube) — collector nào
# chưa có key/token trong .env sẽ tự bỏ qua. Reddit: free tier dành cho mục đích phi thương mại, đọc Data API Terms.
sources:
  curation:
    enabled: true           # bảng curation chấm tay (TikTok-Phap-Ly_Curation_v1.csv), điểm giữ nguyên
    path: "data/curation"
  threads:
    enabled: true           # cần THREADS_ACCESS_TOKEN; tìm theo từ khóa cần App Review của Meta
    keywords: ["đặt cọc", "giữ lương", "thử việc", "cho vay", "chuyển khoản nhầm", "lừa đảo", "nghỉ việc", "hợp đồng"]
  reddit:
    enabled: true           # cần REDDIT_CLIENT_ID/SECRET
    subreddits: ["VietNam", "vozforums"]
    keywords: ["luật", "hợp đồng", "công ty", "cọc", "vay"]
    limit: 50
  youtube:
    enabled: true           # cần YOUTUBE_API_KEY + channel_ids bên dưới
    channel_ids: []         # ID kênh luật lớn (UC...), comment dưới video của họ là mỏ câu hỏi
    max_videos_per_channel: 5
    max_comments_per_video: 100
  rss:
    enabled: true           # chạy được ngay, không cần key
    feeds:
      # Thêm RSS của diễn đàn hỏi đáp pháp luật công khai. Kiểm tra robots.txt + điều khoản từng trang trước.
      # Ví dụ (kiểm tra lại URL còn hoạt động):
      - "https://vnexpress.net/rss/phap-luat.rss"
  inbound:
    enabled: true           # file CSV export từ Google Form "gửi câu hỏi ẩn danh"
    path: "data/inbound"

# ---- LLM (OpenAI-compatible: OpenAI, Gemini OpenAI-endpoint, DeepSeek, Ollama local...) ----
llm:
  model: "gpt-4o-mini"      # đổi theo nhà cung cấp; Ollama: "qwen2.5:14b"
  temperature: 0.3

# ---- Dựng nội dung ----
render:
  mode: "carousel"          # carousel = bộ ảnh TikTok dạng lướt (mặc định); mpt = video qua MoneyPrinterTurbo
  mpt_base_url: "http://localhost:8080"
  voice_name: "vi-VN-HoaiMyNeural"   # Edge TTS, miễn phí
  video_aspect: "9:16"
  subtitle_enabled: true
  bgm: true

carousel:
  author: "Trần Quang Hào · SV Luật Kinh tế"   # hiện trên đầu mỗi ảnh nếu chưa có handle
  handle: ""                # vd "@tenkenh" — đặt khi đã có kênh TikTok
  default_cta: "Luyện 10 câu về chủ đề này ở link bio."
  disclaimer: "Mình là sinh viên Luật. Đây là thông tin chung, không phải tư vấn pháp lý cho trường hợp cụ thể."

web:
  dir: "../web"             # thư mục web trắc nghiệm (so với legal-content-pipeline/)

# ---- Đăng ----
publish:
  mode: "queue"             # queue = xuất file để đăng tay; tiktok = gọi Content Posting API (cần app đã audit)
