<section class="s sang" data-mau="noi-dung" data-nen="sang"  data-trans="fade" data-dur="600" data-notes="Hợp đồng tách bạch năm tư cách. Bên mua bảo hiểm là người giao kết và đóng phí; Bảo Việt cam kết chi trả. Người được bảo hiểm là người có sức khoẻ, tính mạng được bảo vệ — có thể khác người mua. Người thụ hưởng nhận tiền khi người được bảo hiểm tử vong; người chỉ định nhận tiền nhận bồi thường thông thường theo uỷ quyền. Một hợp đồng có thể gồm nhiều người, mỗi người một chương trình, mới hoặc tái tục — tiện cho gói gia đình.">
