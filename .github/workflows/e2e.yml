# Playwright chạy vào bản ĐÃ deploy, sau khi workflow Deploy xong, hoặc bấm tay.
# Không chặn PR/deploy; lỗi ở đây = mở issue/sửa ngay, không rollback tự động.
name: E2E

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  workflow_dispatch:
    inputs:
      base_url:
        description: URL cần kiểm tra
        default: https://tranquanghaofake-dotcom.github.io/Law/
        required: true

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
        env:
          PW_BASE_URL: ${{ inputs.base_url || 'https://tranquanghaofake-dotcom.github.io/Law/' }}
          BASE_PATH: /Law/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
