# Giọng đọc clone (tools/tts/clone.py, VoxCPM2 kèm lời mẫu): chia câu cho nhiều máy chạy song song → gộp vào cache Actions → deploy lấy cache chép vào trang.
# Chạy tay: Actions → "Giọng đọc" → Run workflow. Chạy lại / tự chạy chỉ sinh câu mới hoặc câu đã sửa.
# Sinh lại toàn bộ (~28 900 câu, ~29 giờ âm thanh) là việc nặng: đo trên máy GitHub mỗi câu tốn ~40 giây + ~10 giây cho mỗi giây âm thanh,
# tức khoảng 600–800 giờ máy ≈ 1,5–2 ngày với 20 máy cùng lúc. Chia 200 phần (~3–4 giờ/phần); phần nào chưa xong trong 5 giờ 20 phút thì tự dừng.
# Đổi kiểu giọng: bộ mới gom trong thư mục chờ, web giữ giọng cũ tới khi bộ mới phủ 99,5% số câu; còn thiếu thì workflow tự chạy tiếp.
# Báo cáo (câu cần nghe lại) ở trang tóm tắt của lần chạy.
name: Giọng đọc

on:
  workflow_dispatch:
    inputs:
      shards:
        description: Số phần chia việc (chạy tối đa 20 máy cùng lúc; mỗi phần phải xong trong 5 giờ 20 phút)
        default: '200'
      limit:
        description: Chỉ sinh N câu đầu để thử (0 = tất cả)
        default: '0'
      sample:
        description: Chạy thử N câu chọn đều theo loại câu khó — số điều khoản, viết tắt, ký hiệu… (0 = tắt; nên dùng 24 với 1 máy)
        default: '0'
  push:
    branches: [main]
    paths: ['packages/content/data/**', 'apps/web/scripts/tts-texts.ts', 'tools/tts/**']
  schedule:
    - cron: '17 19 * * 0' # mỗi tuần: bổ sung câu mới và giữ cache không bị xoá sau 7 ngày

permissions:
  contents: read
  actions: write

concurrency:
  group: tts
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Gom mọi câu app có thể đọc (kể cả câu sinh tự động) bằng chính code app → .tts-texts.json
      - run: npm run content && npm run tts:texts -w @luyen-luat/web
      - run: python3 -m unittest tools/tts/test_clone.py tools/tts/test_vi_norm.py tools/tts/test_ab.py
      - uses: actions/cache/restore@v5
        with:
          path: .tts-cache
          key: tts-${{ github.run_id }}
          restore-keys: tts-
      - id: plan
        run: python3 tools/tts/clone.py plan --texts .tts-texts.json --cache .tts-cache --shards "${{ inputs.shards || '200' }}" --limit "${{ inputs.limit || '0' }}" --sample "${{ inputs.sample || '0' }}" --out plan --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: plan
          path: |
            plan
            .tts-texts.json
          include-hidden-files: true
          retention-days: 7

  gen:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/tts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/tts/requirements-clone.txt
      - run: sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r tools/tts/requirements-clone.txt
      - run: python -m unittest tools/tts/test_clone.py
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: giongmodel-v2
      - name: Tải model VoxCPM2 (~4,7 GB) + Whisper small/medium
        run: |
          grep -m1 'model name' /proc/cpuinfo; grep -o -m1 -w 'amx_bf16' /proc/cpuinfo || echo 'CPU không có AMX → float32'
          python - <<'PY'
          from huggingface_hub import snapshot_download as d
          from faster_whisper import WhisperModel
          print('VoxCPM2:', d('openbmb/VoxCPM2'))
          for size in ('small', 'medium'):
              WhisperModel(size, device='cpu', compute_type='int8')
          PY
      - uses: actions/download-artifact@v7
        with:
          name: plan
      - name: Sinh giọng phần ${{ matrix.shard }}
        run: python tools/tts/clone.py run --todo plan/shard-${{ matrix.shard }}.json --out out --deadline 320
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: out-${{ matrix.shard }}
          path: out
          retention-days: 7

  merge:
    needs: [plan, gen]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v5
        with:
          path: .tts-cache
          key: tts-${{ github.run_id }}
          restore-keys: tts-
      - uses: actions/download-artifact@v7
        with:
          path: parts
      # Đổi kiểu giọng: bộ mới gom trong .tts-cache/next, chỉ thay bộ cũ (switched=true) khi đã phủ 99,5% số câu — web không rơi về giọng trình duyệt giữa chừng.
      - id: merge
        run: python3 tools/tts/clone.py merge --cache .tts-cache --texts parts/plan/.tts-texts.json --parts 'parts/out-*' --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v5
        with:
          path: .tts-cache
          key: tts-${{ github.run_id }}
      - uses: actions/upload-artifact@v6
        with:
          name: bao-cao-giong-doc
          path: |
            .tts-cache/report.md
            .tts-cache/report.json
            .tts-cache/next/report.md
            .tts-cache/next/report.json
          include-hidden-files: true
      - name: Deploy lại trang để dùng giọng mới
        if: github.ref == 'refs/heads/main' && steps.merge.outputs.switched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
      - name: Còn câu chưa sinh và lần này có thêm tệp → tự chạy tiếp (không áp dụng cho lần chạy thử)
        if: github.ref == 'refs/heads/main' && steps.merge.outputs.more == 'true' && (inputs.sample || '0') == '0' && (inputs.limit || '0') == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tts.yml --repo "${{ github.repository }}" --ref main
