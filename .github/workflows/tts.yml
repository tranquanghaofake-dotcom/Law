# Giọng đọc clone v5b (tools/tts/clone.py): chia câu cho nhiều máy chạy song song → gộp vào cache Actions → deploy lấy cache chép vào trang.
# Chạy tay: Actions → "Giọng đọc" → Run workflow. Chạy lại / tự chạy chỉ sinh câu mới hoặc câu đã sửa.
# Lần đầu (~13 800 câu, ~20 giờ âm thanh) mất khoảng 5–6 giờ (40 phần, 20 máy cùng lúc, đo thật trên máy GitHub). Báo cáo (câu cần nghe lại) ở trang tóm tắt của lần chạy.
name: Giọng đọc

on:
  workflow_dispatch:
    inputs:
      shards:
        description: Số phần chia việc (chạy tối đa 20 máy cùng lúc; 40 phần ≈ 2,8 giờ/phần, không chạm giới hạn 6 giờ)
        default: '40'
      limit:
        description: Chỉ sinh N câu đầu để thử (0 = tất cả)
        default: '0'
      sample:
        description: Chạy thử N câu chọn đều theo loại câu khó — số điều khoản, viết tắt, ký hiệu… (0 = tắt; nên dùng 40 với 1 máy)
        default: '0'
  push:
    branches: [main]
    paths: ['packages/content/data/**', 'apps/web/scripts/tts-texts.ts', 'tools/tts/**']
  schedule:
    - cron: '17 19 * * 0' # mỗi tuần: bổ sung câu mới và giữ cache không bị xoá sau 7 ngày

permissions:
  contents: read
  actions: write

concurrency:
  group: tts
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Gom mọi câu app có thể đọc (kể cả câu sinh tự động) bằng chính code app → .tts-texts.json
      - run: npm run content && npm run tts:texts -w @luyen-luat/web
      - run: python3 -m unittest tools/tts/test_clone.py tools/tts/test_vi_norm.py
      - uses: actions/cache/restore@v5
        with:
          path: .tts-cache
          key: tts-${{ github.run_id }}
          restore-keys: tts-
      - id: plan
        run: python3 tools/tts/clone.py plan --texts .tts-texts.json --cache .tts-cache --shards "${{ inputs.shards || '40' }}" --limit "${{ inputs.limit || '0' }}" --sample "${{ inputs.sample || '0' }}" --out plan --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: plan
          path: |
            plan
            .tts-texts.json
          include-hidden-files: true
          retention-days: 3

  gen:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/tts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/tts/requirements-clone.txt
      - run: sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r tools/tts/requirements-clone.txt && pip install -q --no-deps voicefixer==0.1.3
      - run: python -m unittest tools/tts/test_clone.py
      - uses: actions/cache@v5
        with:
          path: |
            models
            ~/.cache/huggingface
            ~/.cache/voicefixer
          key: giongmodel-v1
      - name: Tải model VieNeu + bộ giải mã MOSS (tệp thật, không symlink — onnxruntime từ chối dữ liệu ngoài nằm ngoài thư mục model)
        run: |
          python - <<'PY'
          import os, shutil
          from huggingface_hub import snapshot_download as d
          d('pnnbao-ump/VieNeu-TTS-v3-Turbo', allow_patterns=['onnx_update/*'], local_dir='models/vieneu')
          snap = d('OpenMOSS-Team/MOSS-Audio-Tokenizer-Nano-ONNX')
          for f in os.listdir(snap):
              p = os.path.join(snap, f)
              if os.path.islink(p):
                  real = os.path.realpath(p); os.unlink(p); shutil.copy2(real, p)
          print('bộ giải mã:', snap, os.listdir(snap))
          PY
      - uses: actions/download-artifact@v7
        with:
          name: plan
      - name: Sinh giọng phần ${{ matrix.shard }}
        run: python tools/tts/clone.py run --todo plan/shard-${{ matrix.shard }}.json --onnx-dir models/vieneu/onnx_update --out out --deadline 320
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: out-${{ matrix.shard }}
          path: out
          retention-days: 3

  merge:
    needs: [plan, gen]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v5
        with:
          path: .tts-cache
          key: tts-${{ github.run_id }}
          restore-keys: tts-
      - uses: actions/download-artifact@v7
        with:
          path: parts
      - run: python3 tools/tts/clone.py merge --cache .tts-cache --texts parts/plan/.tts-texts.json --parts 'parts/out-*' --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v5
        with:
          path: .tts-cache
          key: tts-${{ github.run_id }}
      - uses: actions/upload-artifact@v6
        with:
          name: bao-cao-giong-doc
          path: |
            .tts-cache/report.md
            .tts-cache/report.json
          include-hidden-files: true
      - name: Deploy lại trang để dùng giọng mới
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
