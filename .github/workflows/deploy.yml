# Deploy lên GitHub Pages khi main thay đổi app hoặc nội dung. Mục tiêu: < 1 phút.
# Cài đặt một lần: Settings → Pages → Source = GitHub Actions.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/content/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          # Trang nằm tại https://<user>.github.io/Law/ nên mọi đường dẫn phải bắt đầu bằng /Law/
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/web/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
