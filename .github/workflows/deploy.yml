# Deploy lên GitHub Pages khi main thay đổi app hoặc nội dung. Mục tiêu: < 1 phút.
# Cài đặt một lần: Settings → Pages → Source = GitHub Actions.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/content/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          # Trang nằm tại https://<user>.github.io/Law/ nên mọi đường dẫn phải bắt đầu bằng /Law/
          BASE_PATH: /${{ github.event.repository.name }}/
      # Giọng đọc dựng sẵn (workflow tts.yml): có cache thì chép vào bản build, không có thì bỏ qua.
      - uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: .tts-cache
          key: tts-none
          restore-keys: tts-
      - run: if ls .tts-cache/*.mp3 >/dev/null 2>&1 && [ -f .tts-cache/manifest.json ]; then mkdir -p apps/web/dist/tts && cp .tts-cache/*.mp3 .tts-cache/manifest.json apps/web/dist/tts/; fi
      - uses: actions/upload-pages-artifact@v5
        with: { path: apps/web/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
