# CI cho mọi nhánh và pull request. Mục tiêu: < 2 phút, một job, cache npm.
# Không chạy Playwright ở đây (xem e2e.yml) để PR không phải chờ cài trình duyệt.
name: CI

# Chỉ chạy trên pull request (không chạy đôi push + PR). Nhánh chưa có PR: chạy `npm run ci` trên máy hoặc bấm Run workflow.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Nội dung · kiểu · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Kiểm tra nội dung luật (schema + tham chiếu)
        run: npm run content
      - name: Kiểm tra kiểu (tsc + svelte-check)
        run: npm run check
      - name: Unit test (vitest)
        run: npm test
      - name: Build như trên Pages
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
