# Cập nhật phụ thuộc mỗi tháng, gộp thành 1 PR để không ngập thông báo.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      npm-thang:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
