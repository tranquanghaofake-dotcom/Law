<!-- bars: dải dài đúng tỉ lệ | thời hạn, số tiền, mức so sánh (đặt nhóm của người đọc lên đầu) -->
<section>
  <div class="secno" data-margin>1</div>
  <h2>Tối đa bao lâu? <small>căn cứ</small></h2>
  <div class="card bars" style="--max:60">
    <div class="bar-row"><div class="lab"><span class="ico" data-icon="coffee"></span>Nhóm A</div><div class="track"><div class="fill" style="width:calc(100% * 6 / var(--max))"></div><span class="num" style="left:calc(100% * 6 / var(--max) + 12px)">6 <small>đơn vị</small></span></div></div>
    <div class="bar-row"><div class="lab"><span class="ico" data-icon="wrench"></span>Nhóm B</div><div class="track"><div class="fill" style="width:calc(100% * 30 / var(--max))"></div><span class="num" style="left:calc(100% * 30 / var(--max) + 12px)">30 <small>đơn vị</small></span></div></div>
  </div>
</section>
